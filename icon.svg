<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#iconBg)" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Subtle Grid Axis Lines -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#223049" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="12" y1="32" x2="52" y2="32" stroke="#223049" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Graph Wave Characteristic -->
  <path d="M12 36C18 36 22 20 32 20C42 20 46 42 52 42" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Arithmetic Math Elements: Plus (+) & Equals (=) -->
  <!-- Plus (+) -->
  <path d="M16 18h6M19 15v6" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <!-- Equals (=) -->
  <line x1="40" y1="17" x2="48" y2="17" stroke="#10b981" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="40" y1="22" x2="48" y2="22" stroke="#10b981" stroke-width="2.8" stroke-linecap="round"/>
  
  <!-- Center Intersection Coordinate Pivot -->
  <circle cx="32" cy="32" r="3.5" fill="#f43f5e" stroke="#0f1523" stroke-width="1.5"/>
  <!-- Complementary Data Node -->
  <circle cx="21" cy="42" r="2.5" fill="#3b82f6"/>
</svg>
